name: Gradle plugin checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Gradle ${{ matrix.gradle }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        gradle: ['8.14.3', '9.1.0']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ matrix.gradle }}
          cache-provider: basic
      - name: Test, validate and build publication artifacts
        run: gradle --no-daemon test validatePlugins publishToMavenLocal --warning-mode all

name: Gradle Isolated Projects compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/isolated-projects.yml'
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated:
    name: ${{ matrix.os }} / Gradle 9.9 / JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17', '25']

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.0'
          cache-provider: basic

      - name: Create a real multi-project Gradle consumer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'isolated-smoke/app', 'isolated-smoke/lib' | Out-Null
          @'
          pluginManagement {
              includeBuild('..')
          }
          rootProject.name = 'isolated-consumer'
          include('app', 'lib')
          '@ | Set-Content -Encoding utf8 'isolated-smoke/settings.gradle'
          @'
          // The plugin is deliberately applied to two independent subprojects.
          plugins {
              id 'java'
              id 'io.github.pitinga.trivy'
          }
          '@ | Set-Content -Encoding utf8 'isolated-smoke/app/build.gradle'
          @'
          plugins {
              id 'java'
              id 'io.github.pitinga.trivy'
          }
          trivy {
              target = '.'
              scanMode = 'fs'
              skipDirs = ['.gradle/trivy']
          }
          '@ | Set-Content -Encoding utf8 'isolated-smoke/lib/build.gradle'

      - name: Check isolated configuration of both projects and default JAR dependency
        shell: pwsh
        run: |
          $params = @('-p', 'isolated-smoke', ':app:trivy', ':lib:trivy', '--isolated-projects', '--dry-run', '--no-daemon', '--stacktrace', '--warning-mode', 'all')
          & gradle @params 2>&1 | Tee-Object -FilePath 'isolated-first.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output = Get-Content 'isolated-first.log' -Raw
          if (-not $output.Contains(':app:jar SKIPPED')) { throw 'Default app target must build jar' }
          if (-not $output.Contains(':app:trivy SKIPPED')) { throw 'App Trivy task was not configured' }
          if (-not $output.Contains(':lib:trivy SKIPPED')) { throw 'Library Trivy task was not configured' }
          if ($output.Contains(':lib:jar SKIPPED')) { throw 'Explicit library target must not build jar' }

      - name: Verify Isolated Projects configuration cache reuse
        shell: pwsh
        run: |
          $params = @('-p', 'isolated-smoke', ':app:trivy', ':lib:trivy', '--isolated-projects', '--dry-run', '--no-daemon', '--stacktrace', '--warning-mode', 'all')
          & gradle @params 2>&1 | Tee-Object -FilePath 'isolated-second.log'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output = Get-Content 'isolated-second.log' -Raw
          if ($output -notmatch '(?i)reusing configuration cache|configuration cache entry reused') {
            throw 'The second Isolated Projects invocation did not reuse the configuration cache'
          }

      - name: Check isolated configuration of an explicit rootfs directory scan
        shell: pwsh
        run: |
          gradle -p isolated-smoke :lib:trivy '-PtrivyScanMode=rootfs' '-PtrivyTarget=.' --isolated-projects --dry-run --no-daemon --stacktrace --warning-mode all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

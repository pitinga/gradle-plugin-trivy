name: Publish Gradle Plugin Portal

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Validate credentials and publication, or publish v0.1.4'
        required: true
        default: validate
        type: choice
        options:
          - validate
          - publish

permissions:
  contents: read

concurrency:
  group: gradle-plugin-portal-v0.1.4
  cancel-in-progress: false

jobs:
  plugin-portal:
    name: Gradle Plugin Portal / ${{ inputs.operation }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable v0.1.4 release
        uses: actions/checkout@v7
        with:
          ref: v0.1.4
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.0'
          cache-provider: basic

      - name: Test and validate plugin implementation
        run: gradle --no-daemon clean test validatePlugins --warning-mode all

      - name: Validate Plugin Portal submission without uploading
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: gradle --no-daemon publishPlugins --validate-only --warning-mode all

      - name: Publish v0.1.4 to Gradle Plugin Portal
        if: inputs.operation == 'publish'
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: gradle --no-daemon publishPlugins --warning-mode all

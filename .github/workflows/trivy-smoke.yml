name: Trivy installer integration smoke

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/trivy-smoke.yml'

jobs:
  install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.0'
          cache-provider: basic
      - name: Create sample consuming project
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          @'
          pluginManagement {
              includeBuild('..')
          }
          rootProject.name = 'trivy-smoke'
          '@ | Set-Content -Encoding utf8 smoke/settings.gradle
          @'
          plugins {
              id 'java'
              id 'io.github.pitinga.trivy'
          }
          trivy {
              preferInstalled = false
              version = '0.76.2'
          }
          '@ | Set-Content -Encoding utf8 smoke/build.gradle
      - name: Download Trivy and verify trivyInstall version header
        shell: pwsh
        run: |
          gradle -p smoke trivyInstall --no-daemon --stacktrace --warning-mode all --configuration-cache *> trivy-install-versions.log
          $exitCode = $LASTEXITCODE
          $log = Get-Content trivy-install-versions.log -Raw
          Write-Host $log
          if ($exitCode -ne 0) { exit $exitCode }
          $expected = (Select-String -Path build.gradle -Pattern "^version = '([^']+)'").Matches[0].Groups[1].Value
          if (-not $log.Contains("Gradle Trivy Plugin : $expected")) { throw "Expected plugin artifact version $expected in trivyInstall header" }
          if ($log -notmatch '(?m)^Trivy CLI\s*:\s*0\.76\.2') { throw 'Expected real Trivy CLI 0.76.2 in trivyInstall header' }
          if ($log -notmatch '(?m)^Gradle\s*:\s*9\.9\.0') { throw 'Expected Gradle version in header' }
          if ($log -notmatch '(?m)^Java\s*:\s*17') { throw 'Expected Java version in header' }
      - name: Reuse configuration cache without project access warnings
        run: gradle -p smoke trivyInstall --no-daemon --warning-mode all --configuration-cache
      - name: Default scan builds JAR and verifies plugin and CLI versions
        shell: pwsh
        run: |
          gradle -p smoke trivy --no-daemon --warning-mode all --configuration-cache --stacktrace *> trivy-scan-versions.log
          $exitCode = $LASTEXITCODE
          $log = Get-Content trivy-scan-versions.log -Raw
          Write-Host $log
          if ($exitCode -ne 0) { exit $exitCode }
          $expected = (Select-String -Path build.gradle -Pattern "^version = '([^']+)'").Matches[0].Groups[1].Value
          if (-not $log.Contains("Gradle Trivy Plugin : $expected")) { throw "Expected plugin artifact version $expected in scan header" }
          if ($log -notmatch '(?m)^Trivy CLI\s*:\s*0\.76\.2') { throw 'Expected real Trivy CLI 0.76.2 in scan header' }
          if (-not $log.Contains('Scanning artifact with Trivy:')) { throw 'Default JAR scan must remain enabled' }
      - name: Explicit project directory scan using trivy fs .
        run: gradle -p smoke trivy '-PtrivyScanMode=fs' '-PtrivyTarget=.' --no-daemon --warning-mode all --configuration-cache --stacktrace
      - name: Explicit project directory scan using trivy rootfs .
        run: gradle -p smoke trivy '-PtrivyTarget=.' --no-daemon --warning-mode all --configuration-cache --stacktrace
      - name: Explicit single JAR scan with rootfs
        run: gradle -p smoke trivy '-PtrivyTarget=build/libs/trivy-smoke.jar' --no-daemon --warning-mode all --configuration-cache --stacktrace
      - name: Create directories for skipDirs integration test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'smoke/.gradle/trivy/local-test' | Out-Null
          New-Item -ItemType Directory -Force -Path 'smoke/generated-cache' | Out-Null
      - name: Verify custom skipDirs and automatic Trivy cache exclusion
        shell: pwsh
        run: |
          gradle -p smoke trivy '-PtrivyTarget=.' '-PtrivySkipDirs=generated-cache,build/tmp' --no-daemon --warning-mode all --configuration-cache --stacktrace *> skip-dirs-output.log
          $status = $LASTEXITCODE
          $log = Get-Content skip-dirs-output.log -Raw
          Write-Host $log
          if ($status -ne 0) { exit $status }
          if (-not $log.Contains('Skipping Trivy directories: generated-cache, build/tmp, ./.gradle/trivy')) {
            throw 'Expected --skip-dirs arguments and automatic Trivy cache exclusion were missing'
          }

      - name: Real JAR scan with Gradle Isolated Projects
        run: gradle -p smoke trivy --isolated-projects --no-daemon --warning-mode all --stacktrace
      - name: Repeat real scan with Isolated Projects configuration cache
        run: gradle -p smoke trivy --isolated-projects --no-daemon --warning-mode all --stacktrace

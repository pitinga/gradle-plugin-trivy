name: GitHub release v0.1.0

on:
  push:
    branches: [main]
    paths: [RELEASE_READY.md]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Validate plugin and generate publication metadata
        run: gradle --no-daemon clean test validatePlugins publishToMavenLocal --warning-mode all
      - name: Check release version
        shell: bash
        run: grep -q "^version = '0.1.0'$" build.gradle

  release:
    name: Create v0.1.0 GitHub release
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Create annotated tag and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo 'GitHub release v0.1.0 already exists.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git ls-remote --exit-code --tags origin refs/tags/v0.1.0 >/dev/null 2>&1; then
            git tag -a v0.1.0 -m 'Gradle Trivy Plugin v0.1.0'
            git push origin refs/tags/v0.1.0
          fi
          gh release create v0.1.0 --verify-tag \
            --title 'Gradle Trivy Plugin v0.1.0' \
            --notes-file CHANGELOG.md

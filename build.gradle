plugins {
    id 'groovy'
    id 'com.gradle.plugin-publish' version '2.2.1'
}

group = 'io.github.pitinga'
version = '0.1.4-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation localGroovy()
    testImplementation gradleTestKit()
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

// Embed the plugin artifact's own version in the resource consumed at task runtime.
def embeddedPluginVersion = project.version.toString()
tasks.named('processResources') {
    inputs.property('embeddedPluginVersion', embeddedPluginVersion)
    filesMatching('io/github/pitinga/trivy/plugin.properties') {
        expand(pluginVersion: embeddedPluginVersion)
    }
}

gradlePlugin {
    website = 'https://github.com/pitinga/gradle-plugin-trivy'
    vcsUrl = 'https://github.com/pitinga/gradle-plugin-trivy'

    plugins {
        trivyPlugin {
            id = 'io.github.pitinga.trivy'
            implementationClass = 'io.github.pitinga.trivy.TrivyPlugin'
            displayName = 'Gradle Trivy Plugin'
            description = 'Automatically install Trivy, build and scan Java/Spring Boot JARs for vulnerabilities with rootfs, or scan selected files and directories'
            tags.set(['trivy', 'security', 'vulnerability', 'spring-boot', 'java'])
            compatibility(it) {
                features {
                    configurationCache = true
                    isolatedProjects = true
                }
            }
        }
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
